stream_name: "mixed_advdiff1d_burgers1d_smoke"
seed: 123
train_test_split_ratio: 0.8
train_val_split_ratio: null
stream_mode: smoke

dataset:
  dataset_name: "mixed"
  dataset_params:
    dataset_root: "data/mixed_advdiff1d_burgers1d_stream"
    context_length: 3
    rollout_steps: 2
    rollout_steps_test: 2
    aux_features: [exp_id]

final_stream_order:
  - [stream_1, 0]
  - [stream_2, 0]
  - [stream_1, 1]
  - [stream_2, 1]

stream_1:
  stream_name: "advdiff1d_stream"
  dataset:
    dataset_name: "advdiff1d"
    dataset_params:
      dataset_root: "data/advdiff1d_stream"
      exp_id: null
      num_snapshots_per_sim: 16
      context_length: 3
      rollout_steps: 2
      rollout_steps_test: 2
      aux_features: [exp_id]
  experience_list:
    smoke:
      - cond_diff_1: [diffusivity.id, equals, diffusivity_value_1]
        cond_vel_1: [velocity.id, equals, velocity_value_1]
      - cond_diff_2: [diffusivity.id, equals, diffusivity_value_2]
        cond_vel_2: [velocity.id, equals, velocity_value_2]

stream_2:
  stream_name: "burgers1d_stream"
  dataset:
    dataset_name: "burgers1d"
    dataset_params:
      dataset_root: "data/burgers1d_stream"
      exp_id: null
      num_snapshots_per_sim: 16
      context_length: 3
      rollout_steps: 2
      rollout_steps_test: 2
      aux_features: [exp_id]
  experience_list:
    smoke:
      - cond_vis_1: [viscosity.id, equals, viscosity_value_1]
      - cond_vis_2: [viscosity.id, equals, viscosity_value_2]
