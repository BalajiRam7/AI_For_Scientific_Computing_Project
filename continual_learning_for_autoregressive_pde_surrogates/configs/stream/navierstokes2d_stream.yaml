stream_name: "navierstokes2d_stream"
seed: 42
train_test_split_ratio: 0.9
train_val_split_ratio: null

dataset:
  dataset_name: "navierstokes2d"
  dataset_params:
    dataset_root: "data/..."
    exp_id: Null
    num_snapshots_per_sim: 99
    context_length: 10
    rollout_steps: 30
    rollout_steps_test: null
    aux_features: [exp_id]

stream_mode: full
experience_list:
  full:
    - cond_vis1: [viscosity.id, equals, viscosity_1]
    - cond_vis2: [viscosity.id, equals, viscosity_2]
    - cond_vis3: [viscosity.id, equals, viscosity_3]
    - cond_vis4: [viscosity.id, equals, viscosity_4]
    - cond_vis5: [viscosity.id, equals, viscosity_5]
    - cond_vis6: [viscosity.id, equals, viscosity_6]

  pretrain:
    - cond_vis3: [viscosity.id, equals, viscosity_3]

  di:
    - cond_vis5: [viscosity.id, equals, viscosity_5]
    - cond_vis1: [viscosity.id, equals, viscosity_1]
    - cond_vis6: [viscosity.id, equals, viscosity_6]
    - cond_vis2: [viscosity.id, equals, viscosity_2]
    - cond_vis4: [viscosity.id, equals, viscosity_4]

