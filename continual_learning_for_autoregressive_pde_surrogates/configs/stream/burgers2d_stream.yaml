stream_name: "burgers2d_stream"
seed: 42
train_test_split_ratio: 0.9
train_val_split_ratio: null

dataset:
  dataset_name: "burgers2d"
  dataset_params:
    dataset_root: "data/..."
    exp_id: Null
    num_snapshots_per_sim: 100
    context_length: 10
    rollout_steps: 30
    rollout_steps_test: null
    aux_features: Null

stream_mode: full
experience_list:
  full:
    - cond_vis_1: [viscosity.id, equals, viscosity_value_1]
    - cond_vis_2: [viscosity.id, equals, viscosity_value_2]
    - cond_vis_3: [viscosity.id, equals, viscosity_value_3]
    - cond_vis_4: [viscosity.id, equals, viscosity_value_4]
    - cond_vis_5: [viscosity.id, equals, viscosity_value_5]

  pretrain:
    - cond_vis_3: [viscosity.id, equals, viscosity_value_3]

  di:
    - cond_vis_5: [viscosity.id, equals, viscosity_value_5]
    - cond_vis_2: [viscosity.id, equals, viscosity_value_2]
    - cond_vis_4: [viscosity.id, equals, viscosity_value_4]
    - cond_vis_1: [viscosity.id, equals, viscosity_value_1]
  
  di_2:
    - cond_vis_5: [viscosity.id, equals, viscosity_value_5]
