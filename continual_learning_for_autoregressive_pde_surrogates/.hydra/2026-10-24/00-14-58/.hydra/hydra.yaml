hydra:
  run:
    dir: .hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: .hydra/multirun/${now:%Y-%m-%d}
    subdir: ${now:%H-%M-%S}/${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - device=cpu
    - seed=123
    - logger.experiment=cl_mixed_smoke_validation
    - logger.outputs_dir=outputs/smoke_tests/mixed_validation
    - model=fno1d
    - model.model_parameters.initial_step=3
    - model.model_parameters.num_embs=10
    - cl_algorithm=naive
    - cl_algorithm.algorithm_parameters.epochs=1
    - cl_algorithm.algorithm_parameters.batch_size=32
    - cl_algorithm.algorithm_parameters.num_workers=0
    - stream=mixed_advdiff1d_burgers1d_smoke
    - stream.dataset.dataset_params.dataset_root=./data/mixed_advdiff1d_burgers1d_stream
    - stream.dataset.dataset_params.context_length=3
    - stream.dataset.dataset_params.rollout_steps=2
    - stream.dataset.dataset_params.rollout_steps_test=2
    - checkpoint_path=null
  job:
    name: train_cl
    chdir: null
    override_dirname: checkpoint_path=null,cl_algorithm.algorithm_parameters.batch_size=32,cl_algorithm.algorithm_parameters.epochs=1,cl_algorithm.algorithm_parameters.num_workers=0,cl_algorithm=naive,device=cpu,logger.experiment=cl_mixed_smoke_validation,logger.outputs_dir=outputs/smoke_tests/mixed_validation,model.model_parameters.initial_step=3,model.model_parameters.num_embs=10,model=fno1d,seed=123,stream.dataset.dataset_params.context_length=3,stream.dataset.dataset_params.dataset_root=./data/mixed_advdiff1d_burgers1d_stream,stream.dataset.dataset_params.rollout_steps=2,stream.dataset.dataset_params.rollout_steps_test=2,stream=mixed_advdiff1d_burgers1d_smoke
    id: ???
    num: ???
    config_name: train_cl
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates/.hydra/2026-10-24/00-14-58
    choices:
      stream: mixed_advdiff1d_burgers1d_smoke
      model: fno1d
      cl_algorithm: naive
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
