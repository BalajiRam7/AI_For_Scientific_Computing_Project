    name: train_cl
    chdir: null
    override_dirname: cl_algorithm.algorithm_parameters.batch_size=512,cl_algorithm.algorithm_parameters.epochs=1,cl_algorithm.algorithm_parameters.ewc_lambda=30.0,cl_algorithm.algorithm_parameters.num_workers=0,cl_algorithm.algorithm_parameters.optimizer_params.lr=0.0001,cl_algorithm=ewc,device=mps,logger.experiment=notebook_cl_all_algorithms_quick,logger.outputs_dir=/Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates/outputs,model.model_parameters.initial_step=3,model.model_parameters.modes=2,model.model_parameters.num_channels=1,model.model_parameters.num_embs=2,model.model_parameters.width=8,model=fno1d,seed=123,stream.dataset.dataset_params.aux_features=[exp_id],stream.dataset.dataset_params.context_length=3,stream.dataset.dataset_params.dataset_root=/Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates/data/advdiff1d_stream,stream.dataset.dataset_params.rollout_steps=2,stream.seed=123,stream.stream_mode=pretrain,stream=advdiff1d_stream
    id: ???
