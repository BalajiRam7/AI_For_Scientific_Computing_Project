hydra:
  run:
    dir: .hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: .hydra/multirun/${now:%Y-%m-%d}
    subdir: ${now:%H-%M-%S}/${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - device=cpu
    - logger.experiment=joint
    - model=fno1d
    - model.model_parameters.num_channels=1
    - model.model_parameters.initial_step=10
    - model.model_parameters.num_embs=6
    - model.model_parameters.emb_dim=2
    - model.model_parameters.learnable_emb=false
    - iid_trainer=joint_trainer
    - iid_trainer.trainer_parameters.epochs=20
    - iid_trainer.trainer_parameters.batch_size=128
    - iid_trainer.trainer_parameters.optimizer_params.lr=0.0001
    - iid_trainer.trainer_parameters.num_workers=0
    - stream=advdiff1d_stream
    - stream.dataset.dataset_params.dataset_root=./data/advdiff1d_stream
    - stream.stream_mode=di
    - stream.dataset.dataset_params.context_length=10
    - stream.dataset.dataset_params.rollout_steps=50
    - stream.dataset.dataset_params.aux_features=[exp_id]
    - stream.seed=123,456,789,111,222
    - seed=0
  job:
    name: train_iid
    chdir: null
    override_dirname: device=cpu,iid_trainer.trainer_parameters.batch_size=128,iid_trainer.trainer_parameters.epochs=20,iid_trainer.trainer_parameters.num_workers=0,iid_trainer.trainer_parameters.optimizer_params.lr=0.0001,iid_trainer=joint_trainer,logger.experiment=joint,model.model_parameters.emb_dim=2,model.model_parameters.initial_step=10,model.model_parameters.learnable_emb=false,model.model_parameters.num_channels=1,model.model_parameters.num_embs=6,model=fno1d,seed=0,stream.dataset.dataset_params.aux_features=[exp_id],stream.dataset.dataset_params.context_length=10,stream.dataset.dataset_params.dataset_root=./data/advdiff1d_stream,stream.dataset.dataset_params.rollout_steps=50,stream.seed=123,456,789,111,222,stream.stream_mode=di,stream=advdiff1d_stream
    id: ???
    num: ???
    config_name: train_iid
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/balajiram/Downloads/continual_learning_for_autoregressive_pde_surrogates/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      stream: advdiff1d_stream
      model: fno1d
      iid_trainer: joint_trainer
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
device: cpu
seed: 0
checkpoint_path: null
logger:
  outputs_dir: outputs/
  repo: .aim
  experiment: joint
  tags: null
iid_trainer:
  trainer_name: joint_trainer
  trainer_parameters:
    num_workers: 0
    batch_size: 128
    epochs: 20
    optimizer: adam
    optimizer_params:
      lr: 0.0001
      weight_decay: 0.0001
    criterion: mse
    criterion_params: {}
    scheduler_params:
      milestones:
      - 50
      gamma: 0.5
model:
  model_name: fno1d
  model_parameters:
    num_channels: 1
    modes: 16
    width: 64
    initial_step: 10
    num_embs: 6
    emb_dim: 2
    learnable_emb: false
stream:
