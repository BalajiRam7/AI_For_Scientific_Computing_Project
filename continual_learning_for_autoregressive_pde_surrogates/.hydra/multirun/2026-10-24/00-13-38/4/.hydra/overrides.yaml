- device=cpu
- logger.experiment=cl_advdiff1d
- model=fno1d
- model.model_parameters.num_channels=1
- model.model_parameters.initial_step=10
- model.model_parameters.num_embs=6
- cl_algorithm=replay
- cl_algorithm.algorithm_parameters.epochs=2
- cl_algorithm.algorithm_parameters.batch_size=128
- cl_algorithm.algorithm_parameters.optimizer_params.lr=0.0001
- cl_algorithm.algorithm_parameters.num_workers=0
- cl_algorithm.algorithm_parameters.memory_size=20
- cl_algorithm.algorithm_parameters.memory_seed=0
- cl_algorithm.algorithm_parameters.memory_mode=experience_balanced
- cl_algorithm.algorithm_parameters.replay_batch_size=128
- cl_algorithm.algorithm_parameters.replay_loss_coef=0.5
- stream=advdiff1d_stream
- stream.dataset.dataset_params.dataset_root=./data/advdiff1d_stream
- stream.stream_mode=di
- stream.dataset.dataset_params.context_length=10
- stream.dataset.dataset_params.aux_features=[exp_id]
- stream.seed=222
- seed=0
- checkpoint_path=PRETRAINED_CHECKPOINT_PATH
