device: cpu
seed: 123
checkpoint_path: null
logger:
  outputs_dir: outputs/smoke_tests/advdiff1d_v2/replay
  repo: .aim
  experiment: cl_advdiff1d_smoke_replay
  tags: null
cl_algorithm:
  algorithm_name: replay
  algorithm_parameters:
    optimizer: adam
    optimizer_params:
      lr: 0.001
    criterion: mse
    criterion_params: {}
    batch_size: 32
    epochs: 1
    memory_size: 200
    memory_seed: 42
    memory_mode: reservoir
    replay_loss_coef: 1.0
    replay_batch_size: 64
    num_workers: 0
model:
  model_name: fno1d
  model_parameters:
    num_channels: 1
    modes: 16
    width: 64
    initial_step: 3
    num_embs: 6
    emb_dim: 2
    learnable_emb: false
stream:
  stream_name: advdiff1d_smoke
  seed: 123
  train_test_split_ratio: 0.8
  train_val_split_ratio: null
  dataset:
    dataset_name: advdiff1d
    dataset_params:
      dataset_root: ./data/advdiff1d_stream
      exp_id: null
      num_snapshots_per_sim: 16
      context_length: 3
      rollout_steps: 2
      rollout_steps_test: 2
      aux_features:
      - exp_id
  stream_mode: smoke
  experience_list:
    smoke:
    - cond_diff_1:
      - diffusivity.id
      - equals
      - diffusivity_value_1
      cond_vel_1:
      - velocity.id
      - equals
      - velocity_value_1
    - cond_diff_2:
      - diffusivity.id
      - equals
      - diffusivity_value_2
      cond_vel_2:
      - velocity.id
      - equals
      - velocity_value_2
